<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>멤버 초대</title>
  <style>
    :root { color-scheme: light dark; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --error: #d70015; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --card: #2c2c2e; --text: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; --error: #ff453a; } }
    :root[data-theme="dark"] { --card: #2c2c2e; --text: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; --error: #ff453a; }
    body { margin: 0; padding: 0 16px; background: transparent; color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
    .card { box-sizing: border-box; width: 100%; max-width: 380px; margin: 10vh auto 0; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
    h1 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
    #tree { max-height: 50vh; overflow-y: auto; margin: 0 0 12px; }
    .group { margin: 0 0 8px; }
    .group > b { display: block; margin: 0 0 4px; color: var(--muted); font-size: 12px; font-weight: 600; }
    label { display: flex; align-items: center; gap: 6px; padding: 2px 0 2px 12px; }
    label.member { color: var(--muted); }
    p { margin: 0 0 12px; min-height: 1.4em; color: var(--error); }
    .actions { display: flex; justify-content: flex-end; gap: 8px; }
    button { padding: 4px 12px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--text); font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <main class="card">
    <h1>멤버 초대</h1>
    <div id="tree"></div>
    <p id="error" role="alert"></p>
    <div class="actions">
      <button id="cancel" type="button">취소</button>
      <button id="pick" type="button" disabled>초대</button>
    </div>
  </main>
  <script type="module" src="./invite.js"></script>
</body>
</html>
